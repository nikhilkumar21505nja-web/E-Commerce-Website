<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEasy – Online Store</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="/index.html" class="logo">🛍️ ShopEasy</a>
      <nav class="nav-links" id="nav-links"></nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Find something you'll love</h1>
      <p>Browse our collection, add items to your cart and check out in minutes.</p>
    </section>

    <div class="filters">
      <input type="search" id="search" placeholder="Search products..." />
      <select id="category">
        <option value="">All categories</option>
      </select>
    </div>

    <div class="product-grid" id="product-grid"></div>
  </main>

  <footer>© 2026 ShopEasy · Built with HTML, CSS, JavaScript, Node.js &amp; MySQL</footer>

  <script src="/js/app.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>

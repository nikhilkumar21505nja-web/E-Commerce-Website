<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="/index.html" class="logo">🛍️ ShopEasy</a>
      <nav class="nav-links" id="nav-links"></nav>
    </div>
  </header>

  <main class="container">
    <form class="form-card" id="login-form">
      <h2>Welcome back</h2>
      <p class="form-footer" style="text-align:left;margin-top:0">Log in to view your cart and orders.</p>

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <p class="error-msg" id="error"></p>
      <button class="btn btn-block" type="submit">Login</button>

      <p class="form-footer">New here? <a href="/register.html">Create an account</a></p>
    </form>
  </main>

  <footer>© 2026 ShopEasy</footer>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>

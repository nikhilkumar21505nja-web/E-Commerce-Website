<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="/index.html" class="logo">🛍️ ShopEasy</a>
      <nav class="nav-links" id="nav-links"></nav>
    </div>
  </header>

  <main class="container">
    <form class="form-card" id="register-form">
      <h2>Create your account</h2>

      <label for="name">Full name</label>
      <input type="text" id="name" required minlength="2" autocomplete="name" />

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" />

      <label for="password">Password (min 6 characters)</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password" />

      <p class="error-msg" id="error"></p>
      <button class="btn btn-block" type="submit">Register</button>

      <p class="form-footer">Already have an account? <a href="/login.html">Login</a></p>
    </form>
  </main>

  <footer>© 2026 ShopEasy</footer>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
